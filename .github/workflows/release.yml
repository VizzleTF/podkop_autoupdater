name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A package's identity is a hash over its payload and mkpkg records mtimes, so
  # without a fixed epoch a rebuild of identical content produces a package that
  # claims to be new. A constant, not a timestamp: identity should depend on what a
  # package contains and nothing else.
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: amd64
            goarch: amd64
            extra_env: ""
          - target: arm64
            goarch: arm64
            extra_env: ""
          - target: armv7
            goarch: arm
            extra_env: "GOARM=7"
          - target: mipsle
            goarch: mipsle
            extra_env: "GOMIPS=softfloat"
          - target: mips
            goarch: mips
            extra_env: "GOMIPS=softfloat"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go/go.sum

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build
        working-directory: go
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          eval "$EXTRA_ENV"
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev}" \
            -o dist/podkop_updater-${{ matrix.target }} \
            ./cmd/podkop_updater

      - name: UPX compress (in place)
        working-directory: go
        run: |
          if upx --best --lzma dist/podkop_updater-${{ matrix.target }}; then
            echo "compressed OK"
          else
            echo "upx failed, shipping uncompressed"
          fi
          ls -lh dist/

      - name: Checksum (post-UPX, the distributed artifact)
        working-directory: go/dist
        run: |
          sha256sum podkop_updater-${{ matrix.target }} > podkop_updater-${{ matrix.target }}.sha256
          cat podkop_updater-${{ matrix.target }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: podkop_updater-${{ matrix.target }}
          path: |
            go/dist/podkop_updater-${{ matrix.target }}
            go/dist/podkop_updater-${{ matrix.target }}.sha256

  # OpenWrt packages, built and signed here rather than by whoever carries them.
  #
  # This repository used to publish only the bare binaries above, and a community
  # feed rebuilt them into packages at the far end. That put the knowledge of which
  # OpenWrt architecture each GOARCH serves, and a copy of the init script, in a
  # repository that is not this one -- and it meant nothing published here was
  # signed, because a checksum served by the same host as the artifact says only that
  # the download was not corrupted.
  package:
    name: Build and sign packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the binaries
        run: |
          mkdir -p go/dist
          find artifacts -name 'podkop_updater-*' ! -name '*.sha256' -exec cp {} go/dist/ \;
          chmod +x go/dist/*
          ls -l go/dist/

      # owfeed is verified against the build attestation from its own release
      # workflow before it runs. It is about to hold the key that signs this release.
      - uses: owfeed/owfeed/setup@v0.3.2
        with:
          version: v0.3.2

      - name: Stage, build and sign
        env:
          # usign key 37ddece4c0eef357, this repository's own. A feed pins its
          # public half -- keys/podkop-updater.pub -- so a signature there means
          # "the author published this" rather than "this downloaded successfully".
          #
          # A key per repository rather than one shared across them: a signature says
          # who wrote something, never what it is about, so one key signing several
          # repositories is how a manifest lifted from one of them verifies as
          # another. The manifest records its `repo` and readers check it, which
          # closes that either way, but a separate key means the question does not
          # arise and a compromise here does not reach anything else.
          #
          # RELEASING.md has where the key lives and what to do if it is lost.
          OWFEED_RELEASE_KEY: ${{ secrets.PODKOP_IPD_USIGN_KEY }}
          # EC prime256v1, this repository's own, pinned by the feed as
          # keys/podkop-updater.pem. A different key and a different job from the
          # usign one above: usign signs the manifest, this signs the packages.
          OWFEED_AUTHOR_KEY: ${{ secrets.OWFEED_AUTHOR_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-r[0-9]*) ;;
            # APKv3 wants a package revision, and a tag rarely carries one.
            *) version="${version}-r1" ;;
          esac
          ./tools/stage.sh "$version"
          owfeed --frozen-lock build

          # Sign each package with this repository's own EC key, BEFORE the manifest
          # is written: `owfeed release` records every package's size and sha256, and
          # signing appends bytes, so the other order describes files that no longer
          # exist.
          #
          # This is not the same claim as the usign signature below. usign signs the
          # manifest -- an inventory of the release, checked once by whoever ingests
          # it. This goes inside the .apk and travels to the router, where anyone
          # holding the public half can confirm who built the package without
          # trusting the feed that served it. A feed signs its index, and an index
          # proves only that the feed published a file.
          #
          # owfeed-packages requires it: a package it cannot attribute is one it
          # refuses to publish.
          [ -n "${OWFEED_AUTHOR_KEY:-}" ] || {
            echo "OWFEED_AUTHOR_KEY is not set. The feed refuses a package signed by"
            echo "nobody, so this release would not be carried."
            exit 1
          }
          owfeed sign --key env:OWFEED_AUTHOR_KEY

          owfeed release --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/manifest.txt
            dist/manifest.txt.sig
            dist/*/*.apk
            dist/*/*.ipk
            dist/*/*.sig
          retention-days: 1

  release:
    name: Publish release
    needs: [build, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Release assets are flat. `owfeed release` has already made every package
      # filename unique -- an apk's name carries no architecture, because in a feed
      # the architecture is the directory, so twenty architectures would otherwise
      # produce twenty files with one name and nineteen of them would not exist.
      - name: Flatten
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp -n {} upload/ \;
          ls -l upload/ | head -20
          test -f upload/manifest.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          generate_release_notes: true
